# golangci-lint v2 config. https://golangci-lint.run/
version: "2"
linters:
  enable:
    # Bugs
    - asasalint
    - bidichk
    - copyloopvar
    - durationcheck
    - errchkjson
    - errorlint
    - forcetypeassert
    - gocheckcompilerdirectives
    - makezero
    - musttag
    - nilerr
    - nilnesserr
    - nilnil
    - reassign
    - recvcheck
    - wastedassign
    # Database and context
    - containedctx
    - contextcheck
    - fatcontext
    - noctx
    - rowserrcheck
    - sqlclosecheck
    # Tests
    - ginkgolinter
    # Modern and simple
    - dupword
    - exptostd
    - mirror
    - modernize
    - nolintlint
    - perfsprint
    - predeclared
    - unconvert
    - unparam
    - usestdlibvars
    # Design: dependencies arrive as parameters, output goes to an injected writer
    - depguard
    - forbidigo
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - iface
    - sloglint
    # Style and security
    - errname
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - noinlineerr
    - nonamedreturns
    - revive
    - tagalign
    # Defaults (https://golangci-lint.run/usage/linters/#enabled-by-default)
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        timeline-pure:
          list-mode: strict
          files:
            - "${base-path}/internal/timeline/**"
            - "!$test"
          allow:
            - $gostd
          deny:
            - pkg: os
              desc: take I/O as parameters
            - pkg: database/sql
              desc: storage lives in internal/store
        export-contract:
          files:
            - "${base-path}/internal/export/**"
          deny:
            - pkg: github.com/macintacos/coroner/internal/store
              desc: exports map internal/timeline types; the SQLite schema is never a contract
            - pkg: github.com/macintacos/coroner/internal/cli
              desc: commands depend on exports, not the other way round
            - pkg: github.com/spf13/cobra
              desc: exports know nothing of commands
        sqlcgen-private:
          files:
            - "!${base-path}/internal/store/**"
          deny:
            - pkg: github.com/macintacos/coroner/internal/store/sqlcgen
              desc: use internal/store; never serialize sqlc models
    exhaustive:
      check:
        - switch
        - map
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^(fmt\.Print(|f|ln)|print|println|log\.(Print|Fatal|Panic)(|f|ln))$
          msg: write to an injected io.Writer
        - pattern: ^os\.(Exit|Getenv|LookupEnv|Environ|ExpandEnv|Setenv|Unsetenv|Clearenv|Args|Stdin|Stdout|Stderr|User(Home|Config|Cache)Dir|Getwd|Chdir|Hostname)$
          msg: only main.go talks to the process
        - pattern: ^syscall\.(Exit|Getenv|Setenv|Environ)$
          msg: only main.go talks to the process
        - pattern: ^time\.(Now|Since|Until)$
          msg: inject a clock (func() time.Time)
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      enable-default-rules: true
      rules:
        - name: dot-imports
          arguments:
            - allowed-packages:
                - github.com/onsi/ginkgo/v2
                - github.com/onsi/gomega
    staticcheck:
      dot-import-whitelist:
        - github.com/onsi/ginkgo/v2
        - github.com/onsi/gomega
  exclusions:
    rules:
      # The process boundary, tests, and `go run` generators. A new path here is a
      # design decision, not a lint fix.
      - path: ^main\.go$|_test\.go$|^internal/tools/
        linters:
          - forbidigo
formatters:
  # No golines: it splits every argument of an over-long call onto its own line,
  # which tears `"key", value` pairs apart in slog/testify-style calls.
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/macintacos/coroner
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/macintacos/coroner
