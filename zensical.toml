[project]
site_name        = "coroner"
site_description = "A command-line tool for building root-cause investigation timelines."
site_url         = "https://macintacos.github.io/coroner/"
repo_url         = "https://github.com/macintacos/coroner"
repo_name        = "macintacos/coroner"

# Unlisted pages, such as every command page but coroner.md, are still built and searchable.
nav = [
  { "Home" = "index.md" },
  { "Tutorial" = [
    "tutorial/index.md",
    { "Your first timeline" = "tutorial/first-timeline.md" },
  ] },
  { "How-to guides" = [
    "how-to/index.md",
    { "Install coroner" = "how-to/install.md" },
    { "Import a colleague's export" = "how-to/import.md" },
    { "Capture Slack messages" = "how-to/capture-slack-messages.md" },
    { "Add log lines" = "how-to/add-log-lines.md" },
    { "Share a timeline in GitHub, Linear, Confluence and chat" = "how-to/export-to-github-linear-confluence.md" },
    { "Query a timeline with jq" = "how-to/query-with-jq.md" },
    { "Show a timeline's events on a Grafana dashboard" = "how-to/grafana-annotations.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "Export format" = "reference/export-format.md" },
    { "Exit codes" = "reference/cli/coroner_help_exit-codes.md" },
    { "Environment variables" = "reference/cli/coroner_help_environment.md" },
    { "Time input" = "reference/cli/coroner_help_time.md" },
    { "Output formats" = "reference/cli/coroner_help_formatting.md" },
    { "Configuration" = "reference/configuration.md" },
    { "CLI" = "reference/cli/coroner.md" },
  ] },
  { "Explanation" = [
    "explanation/index.md",
    { "Data model" = "explanation/data-model.md" },
    { "Timestamps and time zones" = "explanation/timestamps-and-timezones.md" },
    { "Design principles" = "explanation/design-principles.md" },
  ] },
  { "Contributing" = [
    { "Command checklist" = "contributing/command-checklist.md" },
    { "Migration policy" = "contributing/migrations.md" },
    { "Releasing" = "contributing/releasing.md" },
  ] },
]

[project.theme]
features = ["content.code.copy", "navigation.sections"]

[[project.theme.palette]]
media       = "(prefers-color-scheme)"
primary     = "blue grey"
accent      = "amber"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media       = "(prefers-color-scheme: light)"
scheme      = "default"
primary     = "blue grey"
accent      = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media       = "(prefers-color-scheme: dark)"
scheme      = "slate"
primary     = "blue grey"
accent      = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
