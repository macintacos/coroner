[project]
site_name        = "coroner"
site_description = "A command-line tool for building root-cause investigation timelines."
site_url         = "https://macintacos.github.io/coroner/"
repo_url         = "https://github.com/macintacos/coroner"
repo_name        = "macintacos/coroner"

# Unlisted pages, such as every CLI page but coroner.md, are still built and searchable.
nav = [
  { "Home" = "index.md" },
  { "Tutorial" = "tutorial/index.md" },
  { "How-to guides" = [
    "how-to/index.md",
    { "Install coroner" = "how-to/install.md" },
    { "Import a colleague's export" = "how-to/import.md" },
  ] },
  { "Reference" = [
    { "Export format" = "reference/export-format.md" },
    { "CLI" = "reference/cli/coroner.md" },
  ] },
  { "Explanation" = "explanation/index.md" },
  { "Contributing" = [
    { "Command checklist" = "contributing/command-checklist.md" },
    { "Migration policy" = "contributing/migrations.md" },
    { "Releasing" = "contributing/releasing.md" },
  ] },
]

[project.theme]
features = ["content.code.copy", "navigation.sections"]

[[project.theme.palette]]
media       = "(prefers-color-scheme)"
primary     = "blue grey"
accent      = "amber"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media       = "(prefers-color-scheme: light)"
scheme      = "default"
primary     = "blue grey"
accent      = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media       = "(prefers-color-scheme: dark)"
scheme      = "slate"
primary     = "blue grey"
accent      = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
