name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build stamps its version from the tag, which needs the history.
          fetch-depth: 0
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # mise.lock pins every tool but mise itself.
          version: 2026.9.6
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: go run ./internal/tools/release tag-notes --tag "$TAG" --out "$RUNNER_TEMP/release-notes.md"
      - name: Release
        run: goreleaser release --clean --release-notes "$RUNNER_TEMP/release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A token that can push to macintacos/homebrew-tap; the workflow's own token cannot.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
