name: Docs gate
on:
  pull_request:
    # labeled and unlabeled re-run the gate when docs-not-needed is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs-updated:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'docs-not-needed') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Docs updated with CLI changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only | .github/scripts/docs-gate
