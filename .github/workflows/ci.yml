name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every push to main keeps its run, so a red main still says which merge broke it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Restore and save must name the same paths: they are part of the cache's version.
      GO_CACHE_PATHS: |
        ~/go/pkg/mod
        ~/.cache/go-build
        ~/.cache/golangci-lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go's test cache keys each file a test reads on its size and mtime, and checkout sets every
      # mtime to now. Derive a file's from its content, kept in the past or Go won't cache, and fix
      # every directory's, as Go hashes the names a directory lists.
      - name: Pin file times
        shell: bash
        run: |
          git ls-files --stage -z | while IFS=$' \t' read -r -d '' _ blob _ path; do
            touch -m -d "@$((1000000000 + 0x${blob:0:7}))" "$path"
          done
          find . -name .git -prune -o -type d -exec touch -m -d @1000000000 {} +
      - name: Install tools
        id: tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # mise.lock pins every tool but mise itself.
          # Keep in sync with docs.yml and release.yml.
          version: 2026.9.6
      - name: Restore Go caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_CACHE_PATHS }}
          key: go-${{ runner.os }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-
      # Each check runs even when an earlier one failed, but not after a failed tool install.
      # `!= 'failure'` fails closed: a mistyped step id runs the check instead of skipping it.
      - name: Docs gate cases
        if: ${{ !cancelled() && steps.tools.outcome != 'failure' }}
        shell: bash
        run: .github/scripts/docs-gate-test
      - name: Lint
        if: ${{ !cancelled() && steps.tools.outcome != 'failure' }}
        run: mise run lint
      - name: Test
        if: ${{ !cancelled() && steps.tools.outcome != 'failure' }}
        run: mise run test
      - name: Docs build
        if: ${{ !cancelled() && steps.tools.outcome != 'failure' }}
        run: mise run docs:build
      # Last: it rewrites the tree, hiding drift from the steps above. --intent-to-add makes files a
      # generator creates show in the diff, and --ignore-removal keeps files it deletes there too.
      - name: Formatter and generator drift
        if: ${{ !cancelled() && steps.tools.outcome != 'failure' }}
        run: |
          mise run format
          git add --intent-to-add --ignore-removal .
          git diff --exit-code || { echo "::error::mise run format changed files; run it locally and commit the result"; exit 1; }
      # Only a green main run saves, so a pull request restores the newest main cache and writes none.
      - name: Save Go caches
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_CACHE_PATHS }}
          key: go-${{ runner.os }}-${{ github.sha }}
