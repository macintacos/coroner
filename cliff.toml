# git-cliff renders CHANGELOG.md from the Conventional Commit history at release:
#   git cliff --tag vX.Y.Z -o CHANGELOG.md
# https://git-cliff.org/docs/configuration
[changelog]
header = """
# Changelog

Every change to coroner, grouped by kind. Generated from the commit history by git-cliff;
never edit it by hand.

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}
"""
trim = true

[git]
conventional_commits     = true
filter_unconventional    = false
protect_breaking_commits = true
# Groups sort on the HTML comment, which the body template strips.
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking" },
  # `Initial commit` and git's Merge and Revert subjects. filter_unconventional would
  # drop them too, but warns about it on every run.
  { field = "conventional", pattern = "false", skip = true },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^test", group = "<!-- 6 -->Tests" },
  { message = "^(build|ci)", group = "<!-- 7 -->Build" },
  # chore, and the style and revert types.
  { message = ".*", group = "<!-- 8 -->Miscellaneous" },
]
