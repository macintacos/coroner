# git-cliff renders CHANGELOG.md from the Conventional Commit history at release.
# https://git-cliff.org/docs/configuration
[changelog]
header = """
# Changelog

Changes to coroner, grouped by commit type. Generated from the commit history by git-cliff;
never edit it by hand.

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first }}\
{% if commit.breaking and commit.breaking_description != commit.message %} ({{ commit.breaking_description }}){% endif %}
{% endfor %}\
{% endfor %}

"""
trim = true

[git]
conventional_commits     = true
filter_unconventional    = false
protect_breaking_commits = true
# Groups sort on the HTML comment, which the body template strips.
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking" },
  # git's own revert and reapply subjects, which hk.pkl's commit-msg hook lets through.
  { message = '^(Revert|Reapply) "', group = "<!-- 8 -->Miscellaneous" },
  # `Initial commit` and git's merge subjects. filter_unconventional would drop them
  # too, but warns about it on every run.
  { field = "conventional", pattern = "false", skip = true },
  # The release checklist's own commit, tagged after CHANGELOG.md is written.
  { message = '^chore\(release\)', skip = true },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^test", group = "<!-- 6 -->Tests" },
  { message = "^(build|ci)", group = "<!-- 7 -->Build" },
  # chore, style and revert.
  { message = ".*", group = "<!-- 8 -->Miscellaneous" },
]
