[settings]
# Commit mise.lock for reproducible, checksum-pinned tool versions.
lockfile = true

# HK_MISE routes hk's git-hook subprocesses through `mise x`, so each hook step
# uses the versions pinned below — even for committers who never activated mise.
[env]
HK_MISE = 1

[tools]
# hk evaluates hk.pkl through pkl, so both are required. pkl also powers the
# Pkl(Format) / Pkl(Lint) steps (`pkl format` and `pkl eval`).
hk  = "latest"
pkl = "latest"

# The cross-language baseline.
"aqua:google/yamlfmt" = "latest" # YAML format
taplo                 = "latest" # TOML format + lint (config in taplo.toml)
shellcheck            = "latest" # Shell lint
shfmt                 = "latest" # Shell format (see note below)
rumdl                 = "latest" # Markdown lint + format (config in .rumdl.toml)

# shfmt: the registry shorthand occasionally resolves the wrong build. If
# `mise run format` reports an unexpected shfmt version, pin mvdan's shfmt via
# the go backend instead — replace the `shfmt` line above with:
#   "go:mvdan.cc/sh/v3/cmd/shfmt" = "latest"

# Go. golangci-lint must be built with a Go at least as new as go.mod's `go`
# directive — check `golangci-lint --version` when bumping either.
go                   = "latest"
golangci-lint        = "latest"
sqlc                 = "latest"
"aqua:pressly/goose" = "latest"

# Python. uv installs and runs Zensical from pyproject.toml and uv.lock; ruff and
# ty check any Python that lands.
uv   = "latest"
ruff = "latest"
ty   = "latest"

git-cliff = "latest" # Changelog generator (config in cliff.toml)

# Release. goreleaser builds and publishes a tag (config in .goreleaser.yaml); syft
# writes the SBOMs it attaches. goreleaser is pinned, not "latest": .goreleaser.yaml
# follows its deprecations, so bump it with a `mise run release:check`.
goreleaser = "2.18.1"
syft       = "latest"

# (Re)register git hooks whenever tools are installed or updated.
[hooks]
postinstall = "hk install --mise"
